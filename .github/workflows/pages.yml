name: Deploy study app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Cache audio packs
        uses: actions/cache@v6
        with:
          path: webapp/audio
          key: audio-${{ hashFiles('webapp/js/data.js', 'webapp/js/data-saa.js', 'webapp/js/course.js', 'tools/make-audio.py') }}
          restore-keys: |
            audio-

      - name: Validate data
        run: node tools/validate-data.js

      - name: Generate audio packs
        continue-on-error: true
        timeout-minutes: 60
        run: python tools/make-audio.py --skip-unchanged

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
