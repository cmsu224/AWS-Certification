<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Phone-first study plan for AWS Cloud Practitioner (CLF-C02) and Solutions Architect Associate (SAA-C03).">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AWS Study">
  <title>AWS Cert Study</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="main" class="view-today" tabindex="-1">
    <div class="panel">Loading…</div>
  </main>
  <noscript><div class="panel">This study app needs JavaScript turned on.</div></noscript>

  <!-- Persistent audio player (Listen) — survives view changes -->
  <div id="player-dock" hidden>
    <div class="dock-row">
      <span id="dock-title" class="dock-title">Audio</span>
      <button type="button" class="icon-btn" data-act="dock-close" aria-label="Close player">✕</button>
    </div>
    <audio id="dock-audio" controls preload="none"></audio>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav id="bottom-nav" aria-label="Main">
    <button type="button" class="nav-btn active" data-act="nav" data-view="today"><span class="nav-icon">🏠</span><span class="nav-label">Today</span></button>
    <button type="button" class="nav-btn" data-act="nav" data-view="course"><span class="nav-icon">🎓</span><span class="nav-label">Course</span></button>
    <button type="button" class="nav-btn" data-act="nav" data-view="review"><span class="nav-icon">🃏</span><span class="nav-label">Review</span></button>
    <button type="button" class="nav-btn" data-act="nav" data-view="quiz"><span class="nav-icon">📝</span><span class="nav-label">Quiz</span></button>
    <button type="button" class="nav-btn" data-act="nav" data-view="more"><span class="nav-icon">☰</span><span class="nav-label">More</span></button>
  </nav>

  <script src="js/course.js"></script>
  <script src="js/data.js"></script>
  <script src="js/data-saa.js"></script>
  <script src="js/util.js"></script>
  <script src="js/model.js"></script>
  <script src="js/session.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/listen.js"></script>
  <script src="js/today.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
